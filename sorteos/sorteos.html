<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../public/images/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorteos - NAB</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
        .sorteos-container {
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at center, #2a2a2a 0%, var(--bg-color) 70%);
            position: relative;
            overflow-x: hidden;
        }

        .back-nav {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            z-index: 5;
            position: relative;
        }

        .picker-card {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            flex: 1;
            max-width: 600px;
        }

        .side-img {
            width: 400px;
            height: auto;
            border-radius: 20px;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            transition: var(--transition);
            display: block;
        }

        .side-img:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
        }

        @media (max-width: 900px) {
            .main-wrapper {
                flex-direction: column;
            }

            .side-img {
                width: 100%;
                max-width: 350px;
            }
        }

        .deco-img-sorteo {
            position: absolute;
            width: 250px;
            height: auto;
            opacity: 0.3;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
            z-index: 1;
            pointer-events: none;
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.1);
        }

        .left-deco {
            top: 5%;
            left: -80px;
            transform: rotate(-15deg);
        }

        .right-deco {
            bottom: 5%;
            right: -80px;
            transform: rotate(15deg);
        }

        h2 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-sorteo {
            width: 80px;
            margin: 0 auto 15px;
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            background: #2a2a2a;
            border: 2px solid transparent;
            border-radius: 10px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 0.95rem;
            transition: var(--transition);
            margin-bottom: 15px;
            resize: none;
        }

        textarea:focus {
            border-color: var(--primary-color);
            background: #333;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
            background: #2a2a2a;
            border: 2px solid transparent;
            border-radius: 8px;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }

        #results {
            margin-top: 20px;
            width: 100%;
            display: grid;
            gap: 10px;
        }

        .winner-item {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: #000;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: winnerReveal 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 8px 20px rgba(255, 69, 0, 0.3);
            transform: scale(0);
        }

        @keyframes winnerReveal {
            to {
                transform: scale(1);
            }
        }

        .winner-rank {
            font-weight: 900;
            font-size: 1.2rem;
        }

        .winner-name {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Animation overlay */
        #animationArea {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        .floating-name {
            position: absolute;
            color: var(--primary-color);
            font-weight: bold;
            white-space: nowrap;
            opacity: 0.8;
            font-family: var(--font-heading);
            text-transform: uppercase;
            font-size: 1.1rem;
            transition: all 0.3s linear;
        }
    </style>
</head>

<body>
    <div class="sorteos-container">
        <!-- Background Decos -->
        <img src="../public/images/stream_setup.png" alt="" class="deco-img-sorteo left-deco" />
        <img src="../public/images/bbq.png" alt="" class="deco-img-sorteo right-deco" />

        <div class="back-nav">
            <a href="../index.html" class="btn" style="padding: 8px 20px; font-size: 0.9rem;">Volver</a>
        </div>

        <div class="main-wrapper">
            <div class="picker-card">
                <img src="../public/images/logo.jpg" alt="Logo" class="logo-sorteo" />
                <h2>Generador de Sorteos</h2>

                <textarea id="namesInput" placeholder="Nombre 1&#10;Nombre 2&#10;Nombre 3..."></textarea>

                <div class="controls">
                    <div class="input-group">
                        <label for="winnerCount">Ganadores:</label>
                        <input type="number" id="winnerCount" value="1" min="1">
                    </div>
                    <button id="drawBtn" class="btn">¡EMPEZAR SORTEO!</button>
                </div>

                <div id="results"></div>
            </div>

            <img src="../public/images/ganadorRedbull.png" alt="Ganador RedBull" class="side-img" />
        </div>
    </div>

    <div id="animationArea"></div>

    <script>
        const drawBtn = document.getElementById('drawBtn');
        const namesInput = document.getElementById('namesInput');
        const winnerCountInput = document.getElementById('winnerCount');
        const resultsContainer = document.getElementById('results');
        const animationArea = document.getElementById('animationArea');

        drawBtn.addEventListener('click', () => {
            const names = namesInput.value.split('\n')
                .map(n => n.trim())
                .filter(n => n !== '');

            const winnerCount = parseInt(winnerCountInput.value);

            if (names.length < 2) {
                alert('Por favor, ingresa al menos 2 nombres para realizar el sorteo.');
                return;
            }

            if (winnerCount > names.length) {
                alert('La cantidad de ganadores no puede ser mayor a los participantes.');
                return;
            }

            startAnimation(names, winnerCount);
        });

        function startAnimation(names, winnerCount) {
            drawBtn.disabled = true;
            resultsContainer.innerHTML = '';
            animationArea.style.display = 'block';
            animationArea.innerHTML = '';

            const floaters = [];
            const count = Math.min(names.length * 2, 40);

            for (let i = 0; i < count; i++) {
                const floater = createFloater(names[Math.floor(Math.random() * names.length)]);
                floaters.push(floater);
            }

            let duration = 3000;
            let interval = setInterval(() => {
                floaters.forEach(f => moveFloater(f));
            }, 100);

            setTimeout(() => {
                clearInterval(interval);
                pickWinners(names, winnerCount);
            }, duration);
        }

        function createFloater(name) {
            const div = document.createElement('div');
            div.className = 'floating-name';
            div.innerText = name;
            resetFloater(div);
            animationArea.appendChild(div);
            return div;
        }

        function resetFloater(div) {
            div.style.left = Math.random() * 100 + 'vw';
            div.style.top = Math.random() * 100 + 'vh';
            div.style.transform = `scale(${0.5 + Math.random()}) rotate(${(Math.random() - 0.5) * 40}deg)`;
            div.style.opacity = 0.3 + Math.random() * 0.5;
        }

        function moveFloater(div) {
            div.style.left = (parseFloat(div.style.left) + (Math.random() - 0.5) * 30) + 'vw';
            div.style.top = (parseFloat(div.style.top) + (Math.random() - 0.5) * 30) + 'vh';
        }

        function pickWinners(names, winnerCount) {
            const winners = [];
            const pool = [...names];

            for (let i = 0; i < winnerCount; i++) {
                const randomIndex = Math.floor(Math.random() * pool.length);
                winners.push(pool.splice(randomIndex, 1)[0]);
            }

            animationArea.innerHTML = '';
            animationArea.style.display = 'none';

            displayWinners(winners);
            drawBtn.disabled = false;
        }

        function displayWinners(winners) {
            winners.forEach((winner, index) => {
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'winner-item';
                    div.innerHTML = `
                    <span class="winner-rank">#${index + 1}</span>
                    <span class="winner-name">${winner}</span>
                    <span style="font-size: 1.5rem;">👑</span>
                `;
                    resultsContainer.appendChild(div);
                }, index * 600);
            });
        }
    </script>
</body>

</html>
